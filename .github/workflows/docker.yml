name: Docker image

on:
    push:
        branches: [main]
        tags: ['v*']
    # Every pull request, including those stacked on another branch.
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

env:
    IMAGE: ghcr.io/folkloreinc/pingpong
    TEST_TAG: pingpong:test

jobs:
    image:
        name: Build, test and scan the image
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v7

            # Actions outside of actions/* are pinned to a commit.
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Image tags and labels
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ${{ env.IMAGE }}
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}
                      type=sha

            - name: Build
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: docker/Dockerfile
                  platforms: linux/amd64
                  load: true
                  tags: ${{ env.TEST_TAG }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  # The runtime stage upgrades Debian's packages: from the cache, it would keep old ones
                  no-cache-filters: runtime

            - name: Smoke test on a read-only file system
              run: |
                  docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
                      -v /var/lib/pingpong \
                      -v "$PWD/docker/smoke-test.sh:/smoke-test.sh:ro" \
                      --entrypoint sh "$TEST_TAG" /smoke-test.sh

            - name: Scan for vulnerabilities
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  version: v0.75.0
                  image-ref: ${{ env.TEST_TAG }}
                  scanners: vuln
                  severity: HIGH,CRITICAL
                  ignore-unfixed: true
                  exit-code: '1'

            - name: Log in to the GitHub Container Registry
              if: github.event_name != 'pull_request'
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Push
              if: github.event_name != 'pull_request'
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: docker/Dockerfile
                  platforms: linux/amd64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  provenance: mode=max
                  sbom: true
